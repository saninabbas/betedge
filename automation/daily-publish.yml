name: Daily Football Analysis Publisher

on:
  schedule:
    # Runs daily at 06:15 UTC (11:15 AM PKT)
    - cron: '15 6 * * *'
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Target publish date (YYYY-MM-DD)'
        required: false
        default: ''

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Daily Publisher Engine
        run: |
          if [ -n "${{ github.event.inputs.target_date }}" ]; then
            node scripts/publish-daily.js "${{ github.event.inputs.target_date }}"
          else
            node scripts/publish-daily.js
          fi

      - name: Commit and Push Changes
        run: |
          git config user.name "BetEdge Automated Publisher"
          git config user.email "bot@betedge.site"
          git add -A
          if git diff-index --quiet HEAD; then
            echo "No changes to commit. Today's article was already published or pending approval."
          else
            git commit -m "Automated daily publication: $(date +'%B %d, %Y')"
            git push origin main
          fi
